schema_version: 1
zones:
  - ZONE_TABLE1
  - ZONE_TABLE2_CORE
  - ZONE_TABLE2_ASSEMBLY
  - ZONE_TABLE2_PROCESS
  - ZONE_TURNTABLE_SWEEP
  - ZONE_CHANGEOVER_GANTRY
  - ZONE_MODULE_LIBRARY
  - ZONE_MATERIAL_INDEXER
  - ZONE_TOOL_CHANGE
  - ZONE_OUTFEED
  - ZONE_ELEVATOR_TRANSFER
  - ZONE_RACK_FRONT
  - ZONE_FURNACE_LOADING
resources:
  - resource_id: ARM1
    resource_type: ROBOT
    current_tool: vacuum_gripper
    available_tools: [vacuum_gripper, parallel_gripper]
    capabilities:
      - PICK_BASE_PLATE
      - PLACE_BASE_PLATE
      - PREPARE_FIN_TOOL
      - PICK_FIN
      - INSTALL_FIN
      - REINSTALL_FIN
      - INDEX_MATERIAL_KIT
  - resource_id: ARM2
    resource_type: ROBOT
    current_tool: brazing_dispenser
    available_tools: [brazing_dispenser]
    capabilities: [DISPENSE_BRAZING, REWORK_BRAZING]
  - resource_id: ARM3
    resource_type: ROBOT
    current_tool: inspection_camera
    available_tools: [inspection_camera]
    capabilities:
      - INSPECT_BRAZING
      - INSPECT_FINS
      - POST_BRAZE_INSPECTION
      - VERIFY_BASE_ALIGNMENT
      - SECOND_POST_BRAZE_VIEW
  - resource_id: FIXTURE
    resource_type: FIXTURE
    current_tool: null
    available_tools: []
    capabilities: [CONFIGURE_COMB, APPLY_PRESS, LOCK_FIXTURE]
  - resource_id: CHANGEOVER_GANTRY
    resource_type: GANTRY
    current_tool: dual_module_hook
    available_tools: [dual_module_hook, mold_hook, press_hook]
    capabilities:
      - REMOVE_OLD_PRESS
      - REMOVE_OLD_COMB
      - REMOVE_OLD_MOLD
      - FETCH_MOLD
      - INSTALL_MOLD
      - VERIFY_MOLD
      - VERIFY_CHANGEOVER
      - FETCH_COMB
      - INSTALL_COMB
      - VERIFY_COMB
      - FETCH_PRESS_MODULE
      - INSTALL_PRESS_MODULE
  - resource_id: TURNTABLE
    resource_type: TURNTABLE
    current_tool: null
    available_tools: []
    capabilities: [ROTATE_TABLE2, VERIFY_TURNTABLE]
  - resource_id: MATERIAL_INDEXER
    resource_type: INDEXER
    current_tool: null
    available_tools: []
    capabilities: [INDEX_MATERIAL_KIT]
  - resource_id: EMPTY_TRAY_INDEXER
    resource_type: INDEXER
    current_tool: null
    available_tools: []
    capabilities: [INDEX_EMPTY_TRAY]
  - resource_id: OUTFEED
    resource_type: CONVEYOR
    current_tool: null
    available_tools: []
    capabilities: [TRANSFER_TRAY_OUT, ROUTE_PASS, ROUTE_REWORK, ROUTE_SCRAP]
  - resource_id: ELEVATOR
    resource_type: TRANSFER
    current_tool: null
    available_tools: []
    capabilities: [MOVE_ELEVATOR, UNLOAD_RACK_LAYER, SAFE_HOME_TRANSFER]
  - resource_id: TRANSFER_FORK
    resource_type: TRANSFER
    current_tool: null
    available_tools: []
    capabilities: [LOAD_RACK_LAYER, UNLOAD_RACK_LAYER, SAFE_HOME_TRANSFER]
  - resource_id: RACK_LAYER_01
    resource_type: RACK_LAYER
    current_tool: null
    available_tools: []
    capabilities: [LOCK_RACK_LAYER]
  - resource_id: RACK_LAYER_02
    resource_type: RACK_LAYER
    current_tool: null
    available_tools: []
    capabilities: [LOCK_RACK_LAYER]
  - resource_id: RACK_LAYER_03
    resource_type: RACK_LAYER
    current_tool: null
    available_tools: []
    capabilities: [LOCK_RACK_LAYER]
  - resource_id: FURNACE
    resource_type: FURNACE
    current_tool: null
    available_tools: []
    capabilities: [BATCH_READY, RUN_FURNACE, FURNACE_INTERLOCK_CHECK]
