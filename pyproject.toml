[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brazing-sim"
version = "0.2.0"
description = "Three-FR3 MuJoCo brazing-line simulation for configurable heat-sink assemblies"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.5"]
dev = [
  "black>=24.0",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["brazing_sim", "brazing_sim.*"]

[tool.setuptools.data-files]
"brazing_sim/config" = [
  "config/*.yaml",
]
"brazing_sim/config/faults" = ["config/faults/*.yaml"]
"brazing_sim/config/orders" = ["config/orders/*.yaml"]
"brazing_sim/config/products" = ["config/products/*.yaml"]
"brazing_sim/config/routings" = ["config/routings/*.yaml"]
"brazing_sim/scenes/includes" = ["scenes/includes/*.xml"]
"brazing_sim/scenes/production" = ["scenes/production/*.xml"]
"brazing_sim/assets/meshes" = ["assets/meshes/*"]
"brazing_sim/assets/robots/fr3" = [
  "assets/robots/fr3/*.xml",
  "assets/robots/fr3/*.png",
  "assets/robots/fr3/*.md",
  "assets/robots/fr3/LICENSE",
]
"brazing_sim/assets/robots/fr3/assets" = ["assets/robots/fr3/assets/*"]
"brazing_sim/assets/signs" = ["assets/signs/*"]
"brazing_sim/assets/workcells" = ["assets/workcells/*"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
