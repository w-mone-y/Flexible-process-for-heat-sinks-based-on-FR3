[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brazing-sim"
version = "0.1.0"
description = "Three-FR3 MuJoCo brazing-line simulation for configurable heat-sink assemblies"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["PySide6>=6.5"]
dev = [
  "black>=24.0",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools]
packages = ["brazing_sim"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
